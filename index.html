    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Crimson Text"', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              display: ['"Rye"', 'serif'],
            },
            colors: {
              industrial: {
                950: '#140d0a', // Deepest soot
                900: '#1f1612', // Dark leather
                850: '#2a1d18', // Deep bronze shadow

                200: '#e6ccb2', // Parchment
                100: '#f5ebe0', // Bone

              brass: {
                900: '#422f08',

                700: '#a67c13',

                400: '#f0c24b',

                200: '#fcecb3',
              },
              copper: {
                900: '#3d1608',
                700: '#8a3311',
                500: '#c25423',
                400: '#e0764d',

                glow: '#ffae00',
                glass: '#ffcc00',
              }
            },
            backgroundImage: {

              'steampunk-dark': 'radial-gradient(circle at center, #2a1d18 0%, #140d0a 100%)',
            },
            boxShadow: {
              'glow-amber': '0 0 15px rgba(255, 174, 0, 0.4)',
              'glow-brass': '0 0 10px rgba(198, 149, 25, 0.3)',

          },
        },
      }

    <style>
      body {
        background-color: #140d0a;
        color: #e6ccb2;
      }
      .rivet {
        box-shadow: inset 1px 1px 1px rgba(255,255,255,0.4), 1px 1px 3px rgba(0,0,0,0.9);
        background: radial-gradient(circle at 30% 30%, #f0c24b, #75540e);
      }
      .panel-texture {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.05) 2px,
          transparent 2px,
          transparent 4px
        );
      }
      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1f1612; 
        border-left: 1px solid #38251b;
      }
      ::-webkit-scrollbar-thumb {
        background: #75540e; 
        border: 1px solid #38251b;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a67c13;
      }
    </style>
